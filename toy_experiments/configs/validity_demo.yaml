name: validity_demo
generator: validity_demo
# Artificial controlled validity-only stress test, not a natural language benchmark.
# Expected hierarchy: Plain DPA max-token phrase < TPA max-token phrase < shared shard-aware MILP.
K_values: [20, 24]
N_values: [1, 2]
L_values: [2, 3, 4, 5]
T_values: [8]
validity_demo_distribution: heterogeneous
group_size: 8
target_gap: 8
overlap: 5
num_competitor_min: 2
num_competitor_max: 4
target_count_min: 0
target_count_max: 2
competitor_gap_min: 2
competitor_gap_max: 4
competitor_jitter: 1
row_difficulty_jitter: true
position_difficulty_jitter: true
seed: 0
budget_max: 24
budget_plot_num_points: 25
objective_family: validity_only
make_budget_curves: true
make_stability_objectives: false
make_validity_objectives: true
make_stability_budget_curves: false
make_validity_budget_curves: true
solver:
  gurobi_threads: 4
output_dir: toy_experiments/outputs/validity_demo/results
